<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>[NXT] NextGen</title>

<style>

html,body{
    margin:0;
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
    font-family:monospace;
    color:#b000ff;
}


/* Matrix Hintergrund */

#matrix{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    z-index:0;
}


/* Start Bildschirm */

#start{

    position:fixed;
    top:0;
    left:0;

    width:100%;
    height:100%;

    background:#000;

    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;

    z-index:999;

    font-size:22px;

    text-shadow:
    0 0 20px #b000ff;

}


.cursor{

    display:inline-block;

    width:12px;
    height:22px;

    background:#b000ff;

    animation:blink .7s infinite;

}


@keyframes blink{

    50%{
        opacity:0;
    }

}


/* Hauptbox */

#main{

    position:relative;

    z-index:2;

    width:80%;

    margin:80px auto;

    padding:20px;

    border:2px solid #b000ff;

    background:rgba(0,0,0,.85);

    box-shadow:
    0 0 20px #b000ff;

}



.status{

    display:flex;

    gap:10px;

}



.card{

    flex:1;

    border:1px solid #b000ff;

    padding:10px;

    font-size:12px;

}



#terminal{

    height:130px;

    margin-top:20px;

    text-align:left;

    overflow:hidden;

}



#progress{

    height:25px;

    border:2px solid #b000ff;

    margin-top:20px;

}



#bar{

    height:100%;

    width:0%;

    background:#b000ff;

    box-shadow:
    0 0 20px #b000ff;

}

/* Shutdown */

#shutdown{

    position:fixed;

    inset:0;

    background:#000;

    display:none;

    justify-content:center;

    align-items:center;

    flex-direction:column;

    z-index:500;

    font-size:22px;

}


#shutdown div{

    margin:10px;

}




/* Fade Effekt */

#fade{

    position:fixed;

    inset:0;

    background:#000;

    opacity:0;

    z-index:600;

    transition:1s;

}



#fade.active{

    opacity:1;

}





/* Video */

#videoBox{

    position:fixed;

    inset:0;

    background:#000;

    display:none;

    justify-content:center;

    align-items:center;

    z-index:700;

}



#video{

    width:100%;

    height:100%;

    object-fit:contain;

}


</style>

</head>


<body>


<canvas id="matrix"></canvas>




<div id="start">

[NXT] CORE INITIALIZING

<br>

<span class="cursor"></span>

<br>

<span style="font-size:14px">

TOUCH TO START

</span>

</div>





<div id="fade"></div>





<div id="shutdown">


<div>

[NXT] SYSTEM OVERRIDE

</div>


<div>

CONNECTION LOST...

</div>


<div>

TRANSFERRING SIGNAL...

</div>


</div>







<div id="videoBox">


<video id="video" playsinline preload="auto">


<source src="./Rickrolled.mp4" type="video/mp4">


</video>


</div>








<div id="main">


<h1>

[NXT] NextGen

</h1>






<div class="status">


<div class="card">

CPU:

<span id="cpu">0</span>%

</div>



<div class="card">

RAM:

<span id="ram">0</span>%

</div>



<div class="card">

SIGNAL:

<span id="signal">0</span>%

</div>


</div>






<div id="terminal"></div>






<div id="progress">

<div id="bar"></div>

</div>





</div>

<script>

let started = false;

let video = document.getElementById("video");



// Start per Klick / Touch

function startClick(){


    if(started) return;


    started = true;


    // Audio-Freigabe für Browser

    video.muted = true;
    video.play().then(()=>{

        video.pause();
        video.currentTime = 0;

    }).catch(()=>{});



    document.getElementById("start").style.display="none";


    runSystem();


}



document.getElementById("start").addEventListener("click", startClick);

document.getElementById("start").addEventListener("touchstart", startClick);







function runSystem(){


let terminal=document.getElementById("terminal");

let bar=document.getElementById("bar");



let messages=[

"> System startet...",

"> Module werden geladen...",

"> Netzwerk wird geprüft...",

"> Sicherheitssystem aktiv...",

"> Analyse vorbereitet..."

];



let i=0;



let boot=setInterval(()=>{


terminal.innerHTML += messages[i]+"<br>";

i++;



if(i>=messages.length){


clearInterval(boot);

load();


}



},600);






function load(){


let p=0;



let timer=setInterval(()=>{


p++;

bar.style.width=p+"%";



if(p>=100){


clearInterval(timer);


terminal.innerHTML += "<br>> Analyse abgeschlossen";


setTimeout(scan,1000);


}



},40);



}






function scan(){



let scanText=[

"> Suche Datenströme...",

"> Prüfe Knotenpunkt 01...",

"> Synchronisiere Module...",

"> Abschlussprüfung..."

];



let x=0;



let timer=setInterval(()=>{


terminal.innerHTML += scanText[x]+"<br>";

x++;



if(x>=scanText.length){


clearInterval(timer);


setTimeout(endSystem,1500);


}



},600);



}







function endSystem(){



document.getElementById("main").style.display="none";



let shutdown=document.getElementById("shutdown");

let fade=document.getElementById("fade");

let videoBox=document.getElementById("videoBox");



shutdown.style.display="flex";



setTimeout(()=>{


fade.classList.add("active");



setTimeout(()=>{


shutdown.style.display="none";


videoBox.style.display="flex";



video.currentTime=0;

video.muted=false;



video.play().then(()=>{


console.log("Video läuft mit Ton");


}).catch(()=>{


console.log("Browser blockiert Ton");


video.muted=true;

video.play();


});



fade.classList.remove("active");



},1000);



},2000);



}


}







// Status Anzeige


setInterval(()=>{


document.getElementById("cpu").innerHTML =
Math.floor(Math.random()*40+50);



document.getElementById("ram").innerHTML =
Math.floor(Math.random()*50+30);



document.getElementById("signal").innerHTML =
Math.floor(Math.random()*10+90);



},500);








// Matrix Effekt


let canvas=document.getElementById("matrix");

let ctx=canvas.getContext("2d");



function resize(){


canvas.width=window.innerWidth;

canvas.height=window.innerHeight;


}



resize();


window.onresize=resize;



let chars="0123456789ABCDEF";

let size=18;


let columns=Math.floor(canvas.width/size);


let drops=[];


for(let i=0;i<columns;i++){

drops[i]=0;

}






function matrix(){


ctx.fillStyle="rgba(0,0,0,.12)";


ctx.fillRect(
0,
0,
canvas.width,
canvas.height
);



ctx.fillStyle="#b000ff";

ctx.font=size+"px monospace";



for(let i=0;i<drops.length;i++){



ctx.fillText(

chars[Math.floor(Math.random()*chars.length)],

i*size,

drops[i]*size

);



drops[i]++;



if(drops[i]*size > canvas.height){


drops[i]=0;


}



}



}



setInterval(matrix,50);



</script>


</body>

</html>
